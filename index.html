<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>find the club</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="poster">
      <!-- coração -->

      <div class="heart">🖤</div>

      <!-- nomes -->

      <div class="names">l + d</div>

      <!-- mensagem -->
      <div class="stage">
        <div class="content">
          <div class="question">onde é a festa?</div>

          <div class="caption">
            está na horinha de escolherem<br />
            o outfit, não acham?
          </div>

          <!-- countdown -->

          <div class="countdown" id="countdown"></div>
          <button class="cta" id="startBtn">let's go</button>
        </div>

        <div class="loading" id="loading">
          <img src="assets/smile.svg" alt="" id="smile" class="smile" />

          <p id="loadingText"></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
